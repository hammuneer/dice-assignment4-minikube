# Deployment #2 - exposed by a ClusterIP Service (see 12-service-clusterip.yaml)
# Reachable ONLY from inside the cluster through its internal virtual IP / DNS name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-clusterip
  namespace: assignment4
  labels:
    app: app-clusterip
spec:
  replicas: 2                      # two pods -> lets us see load-balancing between pods
  selector:
    matchLabels:
      app: app-clusterip                      # must match the pod template labels below
  template:
    metadata:
      labels:
        app: app-clusterip                    # the Service selects pods by this label
    spec:
      containers:
        - name: pod-name-app
          image: hammuneer/pod-name-app:1.0  # our custom image, public on Docker Hub
          imagePullPolicy: IfNotPresent  # pull from Docker Hub once, then reuse the cached copy
          ports:
            - containerPort: 8080
              name: http
          env:
            # Downward API: Kubernetes injects the pod's own metadata
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: APP_NAME
              value: app-clusterip
            - name: SERVICE_TYPE
              value: ClusterIP
          readinessProbe:          # pod receives traffic only when this succeeds
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:           # container is restarted if this keeps failing
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
