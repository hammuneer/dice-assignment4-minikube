# NodePort Service -> exposes Deployment #1 (app-nodeport)
# Opens the SAME static port (30080) on EVERY node of the cluster.
# Traffic to <NodeIP>:30080 is forwarded to port 80 of the service,
# which load-balances to port 8080 of the matching pods.
# A NodePort service also gets a ClusterIP automatically, so it is reachable
# inside the cluster too.
apiVersion: v1
kind: Service
metadata:
  name: svc-nodeport
  namespace: assignment4
spec:
  type: NodePort
  selector:
    app: app-nodeport        # sends traffic to pods with this label
  ports:
    - name: http
      port: 80               # port of the service's internal ClusterIP
      targetPort: 8080       # containerPort inside the pod
      nodePort: 30080        # static port on every node (allowed range 30000-32767)
